<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your quota</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0.25rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        /* Centered, so the card looks intentional at any height the widget
           gives the iframe. */
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 0.8rem;
        background: transparent;
        /* The iframe cannot inherit the dashboard's color, so the text color
           is set here. Dark first because that is what a self-hoster runs. */
        color: #e2e8f0;
      }
      @media (prefers-color-scheme: light) {
        body {
          color: #1e293b;
        }
      }
      body.theme-dark {
        color-scheme: dark;
        color: #e2e8f0;
      }
      body.theme-light {
        color-scheme: light;
        color: #1e293b;
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.3rem 0.5rem;
        border-radius: 0.25rem;
      }
      .row + .row {
        margin-top: 0.15rem;
      }
      .name {
        opacity: 0.65;
      }
      .value {
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .total {
        background: rgba(148, 163, 184, 0.18);
      }
      .total .value {
        font-weight: 700;
      }
      .empty {
        text-align: center;
        opacity: 0.7;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body class="theme-{{.Theme}}">
    {{if .Missing}}
    <div class="empty">No quota yet</div>
    {{else}}
    {{range .User.Providers}}
    <div class="row">
      <span class="name">{{title .Type}}</span>
      <span class="value">{{.Summary}}</span>
    </div>
    {{end}}
    <div class="row total">
      <span class="name">Total</span>
      <span class="value">{{.User.Summary}}</span>
    </div>
    {{end}}
  </body>
</html>
